<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#000000";
        const THEME_FOLLOW_SYSTEM_STORAGE_KEY = "t3code:theme-follow-system";
        const THEME_APPEARANCE_MODE_STORAGE_KEY = "t3code:theme-appearance-mode";
        const SPLASH_COLORS = {
          light: {
            background: "#ffffff",
            foreground: "#262626",
            accent: "#4f46e5",
          },
          dark: {
            background: "#000000",
            foreground: "#f5f5f5",
            accent: "#818cf8",
          },
        };
        // Keep this small boot-time copy in sync with the built-in palettes so
        // the selected theme is visible before the app has mounted. A stored id
        // missing here (a removed palette or an old custom theme) paints the
        // default, as the runtime does.
        const BUILT_IN_THEME_PALETTES = {
          grove: {
            light: {
              background: "oklch(0.972369 0.005497 157.15)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.523295 0.112292 158.089)",
              chrome: "oklch(0.972369 0.005497 157.15)",
            },
            dark: {
              background: "oklch(0.260865 0.02152 162.75)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.796228 0.133058 157.319)",
              chrome: "oklch(0.260865 0.02152 162.75)",
            },
          },
          ember: {
            light: {
              background: "oklch(0.976527 0.002685 60.725)",
              foreground: "oklch(0.222003 0.03479 328.979)",
              accent: "oklch(0.552831 0.129438 44.656)",
              chrome: "oklch(0.976527 0.002685 60.725)",
            },
            dark: {
              background: "oklch(0.245899 0.019144 42.044)",
              foreground: "oklch(0.990339 0.008411 325.64)",
              accent: "oklch(0.762174 0.124117 52.082)",
              chrome: "oklch(0.245899 0.019144 42.044)",
            },
          },
        };
        const LEGACY_THEME_IDS = { "t3-grove": "grove", "t3-ember": "ember" };
        const setThemeColor = (color) => {
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", color);
          }
        };
        const isThemePreferenceMode = (value) =>
          value === "light" || value === "dark" || value === "system";

        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const themeId =
            storedTheme === null ? "" : (LEGACY_THEME_IDS[storedTheme] ?? storedTheme);
          const palette = Object.hasOwn(BUILT_IN_THEME_PALETTES, themeId)
            ? BUILT_IN_THEME_PALETTES[themeId]
            : null;
          const isKnownTheme =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system" ||
            palette !== null;
          const theme = isKnownTheme && storedTheme ? storedTheme : "system";
          const storedAppearanceMode = window.localStorage.getItem(
            THEME_APPEARANCE_MODE_STORAGE_KEY,
          );
          const storedFollowSystem = window.localStorage.getItem(THEME_FOLLOW_SYSTEM_STORAGE_KEY);
          const preferenceMode = theme === "light" || theme === "dark" ? theme : "light";
          const appearanceMode = isThemePreferenceMode(storedAppearanceMode)
            ? storedAppearanceMode
            : storedFollowSystem === "true"
              ? "system"
              : storedFollowSystem === "false"
                ? preferenceMode
                : theme === "system"
                  ? "system"
                  : preferenceMode;
          const isDark = appearanceMode === "system" ? prefersDark : appearanceMode === "dark";
          const mode = isDark ? "dark" : "light";
          const builtInSplash = palette ? palette[mode] : null;
          const fallbackSplash = SPLASH_COLORS[mode];
          if (palette) {
            document.documentElement.dataset.themeId = themeId;
          } else {
            delete document.documentElement.dataset.themeId;
          }
          const hasSelection = isKnownTheme && storedTheme !== null;
          if (hasSelection) {
            document.documentElement.dataset.themeSelected = "true";
          } else {
            delete document.documentElement.dataset.themeSelected;
          }
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = builtInSplash
            ? builtInSplash.chrome
            : isDark
              ? DARK_BACKGROUND
              : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          if (hasSelection) {
            const splashColors = builtInSplash ?? fallbackSplash;
            for (const name of ["background", "foreground", "accent"]) {
              document.documentElement.style.setProperty(`--boot-${name}`, splashColors[name]);
            }
          }
          setThemeColor(chromeColor);
        } catch {
          let prefersDark = true;
          try {
            prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {}
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.themeSelected;
          document.documentElement.classList.toggle("dark", prefersDark);
          const fallbackColor = prefersDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = fallbackColor;
          setThemeColor(fallbackColor);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #000000;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      /* App CSS locks body and #root scrolling once main loads, so the error screen scrolls itself. */
      #boot-shell:has(> #boot-error) {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #boot-error {
        --boot-error-fg: #262626;
        --boot-error-bg: #ffffff;
        --boot-error-line: color-mix(in srgb, currentColor 12%, transparent);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-self: flex-start;
        width: min(400px, calc(100% - 48px));
        padding: clamp(24px, 22vh, 220px) 0 24px;
        font-size: 13px;
        line-height: 20px;
      }

      html.dark #boot-error {
        --boot-error-fg: #f5f5f5;
        --boot-error-bg: #000000;
      }

      html[data-theme-selected="true"] #boot-error {
        --boot-error-fg: var(--boot-foreground);
        --boot-error-bg: var(--boot-background);
      }

      #boot-error h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      #boot-error p {
        margin: 4px 0 0;
        opacity: 0.7;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      #boot-error code,
      #boot-error pre {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      #boot-error a {
        color: inherit;
        text-decoration-line: underline;
        text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
        text-underline-offset: 3px;
      }

      #boot-error a:hover {
        text-decoration-color: currentColor;
      }

      #boot-error button {
        height: 32px;
        padding: 0 14px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      #boot-error button[aria-disabled="true"] {
        opacity: 0.6;
        cursor: default;
      }

      #boot-error :is(button, a, summary, pre):focus-visible {
        outline: 2px solid var(--boot-error-fg);
        outline-offset: 2px;
      }

      #boot-error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      #boot-error #boot-error-reload {
        border-color: var(--boot-error-fg);
        background: var(--boot-error-fg);
        color: var(--boot-error-bg);
      }

      #boot-error-reload:hover {
        opacity: 0.9;
      }

      #boot-error #boot-error-update-note {
        margin-top: 8px;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error details {
        width: 100%;
        margin-top: 32px;
      }

      #boot-error summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 4px;
        list-style: none;
        opacity: 0.7;
        cursor: pointer;
      }

      #boot-error summary::-webkit-details-marker {
        display: none;
      }

      #boot-error summary::before {
        content: "";
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
      }

      #boot-error details[open] summary::before {
        transform: rotate(45deg);
      }

      #boot-error summary:hover,
      #boot-error details[open] summary {
        opacity: 1;
      }

      #boot-error details > :not(summary) {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }

      #boot-error details > a {
        display: block;
        width: fit-content;
      }

      #boot-error details p {
        margin: 0;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error-command {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 4px 10px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
      }

      #boot-error-command code {
        flex: 1;
        min-width: 0;
        opacity: 0.8;
      }

      #boot-error .boot-error-icon {
        display: grid;
        flex: none;
        place-items: center;
        min-width: 24px;
        height: 24px;
        padding: 0 4px;
        border: 0;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 400;
        opacity: 0.7;
      }

      #boot-error .boot-error-icon:hover {
        opacity: 1;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }

      #boot-error-details {
        max-height: 200px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        font-size: 11px;
        line-height: 16px;
        white-space: pre-wrap;
        opacity: 0.8;
      }

      #boot-error-report {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #boot-error-report button {
        height: 28px;
        padding: 0 10px;
      }

      .boot-error-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <script>
      // Desktop's preload injects branding before page scripts. Titling before the <title> below
      // parses keeps Electron from reporting the web build's channel to the window first.
      const desktopDisplayName = window.desktopBridge?.getAppBranding?.()?.displayName;
      if (desktopDisplayName) document.title = desktopDisplayName;
    </script>
    <!-- vite.config.ts stamps the web build's channel into this title. -->
    <title>T3 Code</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
