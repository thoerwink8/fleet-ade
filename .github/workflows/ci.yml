name: CI

# The upstream workflow was a matrix of hosted jobs (lint, desktop build, sharded
# tests, release smoke, mobile). This repo runs one Ubuntu job: install, then
# `pnpm check`.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config xvfb

      - name: Install Chromium system libraries
        run: node apps/web/node_modules/playwright/cli.js install-deps chromium

      # Playwright launches Chromium with --disable-dev-shm-usage, so the browser
      # keeps shared-memory files on /tmp, not /dev/shm. Print both.
      - name: Runner resources
        run: |
          free -m
          df -h /dev/shm
          df -h /tmp

      - name: Check
        # Vitest collects Chromium garbage only when /tmp has under 4 GiB free.
        # A 14 GB runner still has more than that when the browser connection drops.
        env:
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: "1024"
        run: |
          ( while true; do
              echo "---- runner $(date -u +%H:%M:%S) ----"
              free -m
              df -h /dev/shm /tmp
              sleep 60
            done ) &
          sampler=$!
          set +e
          pnpm check
          code=$?
          kill "$sampler" || true
          exit "$code"
