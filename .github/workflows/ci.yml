        with:
          node-version-file: package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check static
        run: pnpm check lint ui-no-english typecheck preview-python release-checks

  server:
    name: Server (${{ matrix.shard }}/2)
    needs: [web, static]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, fleet-fr]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Strip orphan gitlinks before checkout
        run: |
          if [ ! -d .git ]; then
            exit 0
          fi
          git config --global --add safe.directory "$PWD" || true
          gitlinks=$(
            {
              git ls-files --stage 2>/dev/null
