name: CI

# Runs `pnpm check` as parallel jobs on GitHub-hosted runners, then
# gates on the final `Check` summary job.
on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"
  T3CODE_TELEMETRY_ENABLED: "false"
  OTEL_SDK_DISABLED: "true"

jobs:
  # Small hosted runners use one browser worker per shard instead of sharing a large pool.
  web:
    name: Web browser (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps --only-shell chromium

      - name: Runner resources
        run: |
          nproc
          free -m
          df -h /dev/shm /tmp

      - name: Check web
        # Vitest collects Chromium garbage only when /tmp has under 4 GiB free.
        # Force post-file Chromium GC so long runs do not drop the browser connection.
        env:
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: "1024"
        run: |
          pnpm --dir apps/web exec vp test run --project unit --shard=${{ matrix.shard }}/8 --maxWorkers=2
          pnpm --dir apps/web exec vp test run --project browser --shard=${{ matrix.shard }}/8 --maxWorkers=1

  packages:
    name: Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps --only-shell chromium

      - name: Install native secret service build dependencies
        run: sudo apt-get install --yes --no-install-recommends libsecret-1-dev

      - name: Check packages
        run: pnpm check ensure-electron packages

  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check static
        run: pnpm check lint ui-no-english typecheck preview-python release-checks

  server:
    name: Server (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps --only-shell chromium

      - name: Check server shard
        run: pnpm check "server ${{ matrix.shard }}/2"

  check:
    name: Check
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [web, packages, static, server]
    timeout-minutes: 10
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify all jobs succeeded
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq .
          printf '%s\n' "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' > /dev/null
