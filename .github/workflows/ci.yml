          PY
          {
            echo "pnpm_config_store_dir=$cache_root/pnpm-store"
            echo "XDG_DATA_HOME=$cache_root/xdg-data"
            echo "XDG_CACHE_HOME=$cache_root/xdg-cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$cache_root/ms-playwright"
            echo "VITE_CACHE_PATH=$cache_root/vite-task-cache"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check packages
        run: pnpm check ensure-electron chromium packages

  static:
    name: Lint & Typecheck
    needs: [web]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, fleet-fr]
    timeout-minutes: 120
    steps:
      - name: Strip orphan gitlinks before checkout
        run: |
          if [ ! -d .git ]; then
            exit 0
          fi
          git config --global --add safe.directory "$PWD" || true
