      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check server shard
        run: pnpm check chromium "server ${{ matrix.shard }}/2"

  check:
    name: Check
    runs-on: [self-hosted, fleet-fr]
    if: ${{ always() }}
    needs: [web, packages, static, server]
    timeout-minutes: 10
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify all jobs succeeded
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq .
          printf '%s\n' "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' > /dev/null
